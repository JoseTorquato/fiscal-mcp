<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="fiscal-mcp">
  <title>fiscal-mcp</title>
  <!--
    A marca é a chave de acesso: as barras do código impresso no DANFE, que
    todo mundo que mexe com fiscal reconhece de imediato. As três barras da
    direita descem em degrau e fecham num tique — o documento conferido.
  -->
  <rect width="64" height="64" rx="8" fill="#0A0A0A"/>
  <g fill="#22C55E">
    <rect x="12" y="18" width="3" height="28" rx="1.5"/>
    <rect x="18" y="22" width="2" height="20" rx="1"/>
    <rect x="23" y="18" width="3" height="28" rx="1.5"/>
    <rect x="29" y="24" width="2" height="16" rx="1"/>
  </g>
  <!-- o tique nasce das barras: fiscal conferido -->
  <path d="M34 34 L40 42 L52 22" fill="none" stroke="#22C55E" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
