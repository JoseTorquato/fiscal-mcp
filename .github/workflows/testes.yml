name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[servidor]"
      - run: python tests/test_fatia_zero.py

  instalacao-limpa:
    # O pacote precisa funcionar instalado, não só no repositório clonado —
    # as regras vivem fora do pacote e já quase ficaram de fora do wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: as regras vieram junto?
        run: |
          cd /tmp
          python -c "from fiscal_mcp.regras import carrega; n=len(carrega()); print(f'{n} regras'); assert n >= 10, 'regras não foram embarcadas no pacote'"
      - name: a CLI funciona?
        run: |
          fiscal-mcp validar exemplos/nfe-valida.xml
          fiscal-mcp validar exemplos/nfse-nacional.xml
          fiscal-mcp rejeicao 539
