grupo: ibs-cbs
#
# Camada A do IBS/CBS — validação estrutural.
# Ver docs/spec/05-camada-a-ibs-cbs.md.
#
# O que separa esta camada da próxima: aqui tudo é verificável contra dado
# baixável e versionado (o XSD oficial e a tabela CST/cClassTrib da SVRS), então
# pode ser `erro`. Os CÓDIGOS numéricos de rejeição não foram confirmados em
# fonte primária, e por isso nenhuma mensagem daqui cita um. Descrever o
# problema sem o número é sempre permitido e quase sempre suficiente: quem lê é
# um agente que precisa saber o que fazer, não decorar o código do erro.
#
# Sobre a obrigatoriedade do grupo: a NT 2025.002 v1.51, aprovada pelo Ato
# Técnico Conjunto RFB/CGIBS nº 1 de 31/07/2026, reclassificou a regra UB12-10
# de data fixa para "implementação futura". As v1.52 (01/10/2026) e v1.53
# (30/10/2026) mantiveram esse status sem data de produção. A rejeição por
# ausência do grupo NÃO está ativa em produção para NF-e e NFC-e. É postergação
# técnica, não jurídica: a obrigação de destacar permanece e condiciona a
# dispensa de recolhimento do art. 348 da LC 214/2025.
#
# Duas regras nascem como aviso de propósito, e a razão está em cada uma.

regras:

  # ---- ausência do grupo: aviso, porque a rejeição está postergada ----------

  - id: ibs-grupo-ausente
    tipo: existe
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS
    mensagem: Grupo IBSCBS ausente no item
    referencia: >
      NT 2025.002 v1.53 · UB12-10 segue como implementação futura desde a v1.51
    vigencia:
      reavaliar_em: "2026-12-14"
      fonte: "NT 2025.002-RTC v1.53, de 30/10/2026 (UB12-10, Obs. 2)"
      observacao: >
        A v1.53 não dá data de produção para a UB12-10. 14/12/2026 é o próximo
        marco oficial que mexe no grupo IBSCBS: entrada em produção da NT
        2026.005 (grupo gTribSN), adiada para essa data pelo aviso CGIBS/RFB de
        12/11/2026. Conferir ali se a UB12-10 ganhou data.
    acao: >
      Inclua o grupo IBSCBS com CST e cClassTrib no item. A rejeição
      correspondente segue postergada para implementação futura na NT 2025.002
      v1.53 (desde a v1.51), então a nota não é recusada por isso hoje — mas o
      destaque continua legalmente obrigatório e condiciona a dispensa de
      recolhimento do art. 348 da LC 214/2025.

  # ---- L-01 a L-04: CST e cClassTrib contra a tabela oficial ---------------

  - id: ibs-cst-existe
    tipo: em_tabela
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/CST
    tabela: cst-cclasstrib
    coluna: cst
    mensagem: CST de IBS/CBS não existe na tabela oficial
    referencia: Tabela de Classificação Tributária · Portal da Conformidade Fácil (SVRS)
    acao: >
      Use um dos 18 CST publicados. `fiscal-mcp tabelas` mostra qual versão da
      tabela está embarcada; a lista completa está em
      regras/tabelas/cst-cclasstrib.json.

  - id: ibs-cclasstrib-prefixo-cst
    tipo: prefixo_de
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/cClassTrib
    campo_referencia: imposto/IBSCBS/CST
    tamanho: 3
    mensagem: cClassTrib não corresponde ao CST do item
    referencia: cClassTrib tem 6 dígitos, e os 3 primeiros são o próprio CST
    acao: >
      Os três primeiros dígitos do cClassTrib são o CST do item. Este é o erro
      mais comum ao ligar o módulo de IBS/CBS num ERP: uma classificação
      genérica é aplicada a todos os itens e deixa de casar com o CST de cada um.

  - id: ibs-cclasstrib-existe
    tipo: em_tabela
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    mensagem: cClassTrib não existe na tabela oficial
    referencia: Tabela de Classificação Tributária · Portal da Conformidade Fácil (SVRS)
    acao: >
      Confira o código na tabela oficial. Códigos são publicados por ato do
      Comitê Gestor — código novo pode significar que a tabela embarcada está
      desatualizada; `fiscal-mcp tabelas` mostra a versão em uso.

  - id: ibs-cclasstrib-modelo
    tipo: em_tabela
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    filtro: modelo_do_documento
    mensagem: cClassTrib não é permitido neste modelo de documento
    referencia: Indicadores IndNfe e IndNfce da tabela oficial
    # Código em transição em NF-e: quem cuida dele ali é a regra abaixo, como
    # aviso. Em NFC-e ele nunca valeu (IndNfce falso nas duas tabelas) e continua
    # erro aqui.
    exceto: ["550002"]
    exceto_nos_modelos: ["55"]
    acao: >
      A tabela oficial diz, para cada cClassTrib, em quais documentos ele vale.
      Este código existe, mas não para o modelo desta nota — escolha a
      classificação equivalente prevista para o modelo.

  # O 550002 valia em NF-e na tabela de 22/06/2026 e não vale na publicada em
  # 30/10/2026 (IndNfe desligado), sem mudança de vigência: DthFimVig continua
  # vazio, e a própria linha ainda traz DthPublicacao 22/06/2026. O IT 2025.002
  # registra a desativação na sua v1.60 (§07.08, "Desativação para NFe:
  # 550002"); nenhuma data dela é citada aqui. O motor não olha a data de
  # emissão, então nota emitida enquanto o código valia seria reprovada hoje — e
  # não há fonte primária de que a SEFAZ rejeite cClassTrib × modelo em
  # produção. Até haver, é aviso. Só em NF-e: é o único modelo em que ele valia.
  - id: ibs-cclasstrib-modelo-transicao
    tipo: em_tabela
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    filtro: modelo_do_documento
    somente: ["550002"]
    modelos: ["55"]
    mensagem: >-
      cClassTrib deixou de ser permitido em NF-e a partir da tabela SVRS
      publicada em 30/10/2026 (IT 2025.002 v1.71)
    referencia: >-
      IT 2025.002 v1.71 · Tabela de Classificação Tributária (SVRS), publicação
      de 30/10/2026 · indicador IndNfe
    vigencia:
      reavaliar_em: "2026-12-14"
      fonte: "IT 2025.002 v1.71, de 30/10/2026"
      observacao: >
        Aviso de transição, e não erro, porque a tabela desligou o IndNfe sem
        fim de vigência e não há fonte primária de rejeição ativa em produção.
        14/12/2026 é checkpoint de revisão do projeto, não data trazida por
        fonte oficial: o aviso CGIBS/RFB de 12/11/2026 não trata da tabela, e a
        data só foi alinhada às demais revisões. Sem fonte de rejeição até lá,
        mover a data; com fonte, promover a erro e tirar o código do `exceto`
        da regra acima.
    acao: >
      A tabela oficial vigente não prevê mais este cClassTrib em NF-e. Em nota
      nova, escolha na tabela (`fiscal-mcp tabelas`) a classificação prevista
      para NF-e que corresponde à operação. O aviso não afirma que nota já
      autorizada com este código esteja errada: a tabela não deu fim de
      vigência a ele.

  # ---- L-05: subgrupos exigidos pelos indicadores --------------------------
  #
  # A regra mais valiosa e a mais perigosa. Nasce como AVISO e só vira erro
  # depois de rodar contra pelo menos três XMLs reais distintos sem falso
  # positivo — a promoção fica registrada no CHANGELOG (spec 05 §6).
  #
  # O mapa cobre só os subgrupos cujo caminho é inequívoco. gRed e gDif ficaram
  # de fora de propósito: aparecem sob gIBSUF, gIBSMun E gCBS, e um caminho só
  # não os expressa. Entram quando a Camada XSD resolver a cardinalidade.

  - id: ibs-subgrupos-obrigatorios
    tipo: subgrupos_por_indicador
    escopo: item
    severidade: aviso
    campo_chave: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    mapa:
      IndMonofasica: imposto/IBSCBS/gIBSCBSMono
      IndTransferenciaCred: imposto/IBSCBS/gTransfCred
      IndAjusteCompet: imposto/IBSCBS/gAjusteCompet
      IndTribRegular: imposto/IBSCBS/gIBSCBS/gTribRegular
      IndPermiteCredPres: imposto/IBSCBS/gCredPresOper
      IndCredPresIbsZfm: imposto/IBSCBS/gCredPresIBSZFM
      IndEstornoCred: imposto/IBSCBS/gEstornoCred
    mensagem: Subgrupo de IBS/CBS incompatível com a classificação tributária
    referencia: Indicadores da tabela oficial, nos níveis CST e cClassTrib
    vigencia:
      reavaliar_em: "2026-12-14"
      fonte: >-
        Tabela de Classificação Tributária (SVRS) — versão embarcada, ver
        regras/tabelas/PROCEDENCIA.md
      observacao: >
        Reavaliar em 14/12/2026, quando a NT 2026.005 entra em produção (aviso
        CGIBS/RFB de 12/11/2026) e o grupo gTribSN passa a existir no IBSCBS —
        o mapa de subgrupos precisa ser conferido contra ela. Entra como aviso.
        Promover a erro só depois de três XMLs reais distintos sem falso
        positivo, com a promoção registrada no CHANGELOG.
    acao: >
      A classificação tributária escolhida determina quais subgrupos o item
      precisa trazer e quais não admite. Confira o cClassTrib contra o
      preenchimento, ou corrija a classificação se o preenchimento é que está
      certo.

  # ---- L-06 a L-10: aritmética, exclusividade, presença condicional --------

  - id: ibs-vibs-soma-uf-mun
    tipo: soma_campos
    escopo: item
    severidade: erro
    campo_total: imposto/IBSCBS/gIBSCBS/vIBS
    campos:
      - imposto/IBSCBS/gIBSCBS/gIBSUF/vIBSUF
      - imposto/IBSCBS/gIBSCBS/gIBSMun/vIBSMun
    tolerancia: "0.01"
    mensagem: vIBS não é a soma das parcelas estadual e municipal
    referencia: Leiaute UB54a · vIBS = vIBSUF + vIBSMun
    acao: >
      O vIBS do item é a soma de vIBSUF e vIBSMun. Diferença de centavos costuma
      ser arredondamento aplicado no total em vez de item a item.

  - id: ibs-totais-conferem-ibs
    tipo: soma_itens
    severidade: erro
    campo_item: imposto/IBSCBS/gIBSCBS/vIBS
    campo_total: total/IBSCBSTot/gIBS/vIBS
    tolerancia: "0.01"
    mensagem: Total de IBS não bate com a soma dos itens
    referencia: Grupo W34 · IBSCBSTot
    acao: >
      Some o vIBS de cada item e compare com total/IBSCBSTot/gIBS/vIBS.

  - id: ibs-totais-conferem-cbs
    tipo: soma_itens
    severidade: erro
    campo_item: imposto/IBSCBS/gIBSCBS/gCBS/vCBS
    campo_total: total/IBSCBSTot/gCBS/vCBS
    tolerancia: "0.01"
    mensagem: Total de CBS não bate com a soma dos itens
    referencia: Grupo W34 · IBSCBSTot
    acao: >
      Some o vCBS de cada item e compare com total/IBSCBSTot/gCBS/vCBS.

  - id: ibs-grupo-exclusivo
    tipo: exclusivo
    escopo: item
    severidade: erro
    campos:
      - imposto/IBSCBS/gIBSCBS
      - imposto/IBSCBS/gIBSCBSMono
      - imposto/IBSCBS/gTransfCred
      - imposto/IBSCBS/gAjusteCompet
    mensagem: Mais de um regime de IBS/CBS no mesmo item
    referencia: Escolha UB14k · no máximo um dos ramos
    acao: >
      O item segue um regime só: tributação normal (gIBSCBS), monofasia
      (gIBSCBSMono), transferência de crédito (gTransfCred) ou ajuste de
      competência (gAjusteCompet). Remova os que não se aplicam.

  # Segundo choice do grupo, que a spec 05 §4 não documentava e o XSD mostra:
  # gCredPresOper e gCredPresIBSZFM são mutuamente exclusivos.
  - id: ibs-credito-presumido-exclusivo
    tipo: exclusivo
    escopo: item
    severidade: erro
    campos:
      - imposto/IBSCBS/gCredPresOper
      - imposto/IBSCBS/gCredPresIBSZFM
    mensagem: Dois regimes de crédito presumido no mesmo item
    referencia: Escolha entre gCredPresOper e gCredPresIBSZFM · XSD TTribNFe
    acao: >
      O item usa crédito presumido por operação (gCredPresOper) ou o da Zona
      Franca de Manaus (gCredPresIBSZFM), nunca os dois. Remova o que não se
      aplica.

  - id: ibs-cst-620-exige-mono
    tipo: condicional
    escopo: item
    severidade: erro
    quando_campo: imposto/IBSCBS/CST
    quando_valor: ["620"]
    campo: imposto/IBSCBS/gIBSCBSMono
    mensagem: CST de monofasia sem o grupo de monofasia
    referencia: CST 620 · IndMonofasica na tabela oficial
    acao: >
      O CST 620 identifica operação monofásica e exige o grupo gIBSCBSMono no
      item. Se a operação não é monofásica, o CST é que está errado.

  # Roda por item e olha para fora dele: `quando_campo` é relativo ao `det`,
  # `campo` começa com `/` e vale a partir da raiz. A versão anterior rodava no
  # documento e só enxergava o primeiro `det`, então nota em que apenas um item
  # do meio trazia o grupo passava batido.
  - id: ibs-totais-presentes
    tipo: condicional
    escopo: item
    severidade: erro
    quando_campo: imposto/IBSCBS/CST
    campo: /total/IBSCBSTot
    mensagem: Item com IBS/CBS e nota sem o grupo de totais
    referencia: Grupo W34 · IBSCBSTot
    acao: >
      Se algum item traz o grupo IBSCBS, a nota precisa trazer o grupo de totais
      IBSCBSTot com as bases e os valores consolidados.

  # ---- L-11 a L-14: formato, enums, alíquotas ------------------------------

  # O padrão aceita sufixo de fuso porque o tipo real no XSD é `xs:gYearMonth`, e
  # `2026-08Z` e `2026-08+03:00` são valores VÁLIDOS. A primeira versão desta
  # regra exigia só `AAAA-MM` e teria reprovado nota correta — o mesmo defeito
  # que tirou a regra de escala decimal do repositório, achado do mesmo jeito:
  # comparando a regra contra o XSD em vez de contra a leitura do leiaute.
  #
  # O que esta regra NÃO cobre e o schema cobre: o `minInclusive 2025-01`, que
  # reprova competência anterior à reforma. Pegar menos é aceitável; acusar
  # errado não é. Com o extra [xsd] instalado, o schema fecha essa parte.
  - id: ibs-competapur-formato
    tipo: formato
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/gAjusteCompet/competApur
    padrao: "\\d{4}-(0[1-9]|1[0-2])(Z|[+-]\\d{2}:\\d{2})?"
    mensagem: Competência de apuração fora do formato
    referencia: Grupo UB112 · competApur, tipo xs:gYearMonth do XSD oficial
    acao: >
      A competência vai como AAAA-MM, ex.: 2026-08. O leiaute admite sufixo de
      fuso horário (2026-08Z, 2026-08+03:00), mas não outro formato de data.

  # A regra de escala decimal que a spec 05 §6 previa (L-12) foi RETIRADA por
  # dois motivos, e o segundo é o que decide:
  #
  #   1. é redundante — o XSD já valida a escala pelo tipo TDec1302RTC;
  #   2. estava ERRADA. O padrão do leiaute é `0|0\.[0-9]{2}|[1-9][0-9]{0,12}(\.[0-9]{2})?`,
  #      que aceita `0` sozinho. A regra escrita à mão exigia sempre duas casas e
  #      teria reprovado `<vIBS>0</vIBS>`, que é válido.
  #
  # É o caso exemplar de por que o XSD é a verdade executável: a regra de formato
  # escrita a partir da leitura do leiaute tinha um falso positivo latente.
  # Escala decimal agora é responsabilidade da camada de schema (extra [xsd]).

  - id: ibs-enum-credpres-zfm
    tipo: valor_em
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/gCredPresIBSZFM/tpCredPresIBSZFM
    valores: ["0", "1", "2", "3", "4"]
    mensagem: Tipo de crédito presumido da ZFM fora dos valores previstos
    referencia: Domínio de tpCredPresIBSZFM
    acao: Use um dos valores previstos no leiaute para o crédito presumido da ZFM.

  # A regra de tpALCZFMCBS que a spec 05 §6 previa foi RETIRADA: o elemento não
  # existe no XSD oficial embarcado, e o domínio {1,2} veio de extração de PDF,
  # sem confirmação em fonte primária. Regra sobre elemento inexistente é peso
  # morto, e domínio não confirmado é exatamente o que este projeto não publica.
  # Volta quando aparecer num pacote de schema, com o domínio lido do XSD.

  # Alíquotas de transição, por ano de emissão (LC 214/2025, arts. 343 a 347).
  #
  # Cada regra vale só para nota emitida no seu período, pelo bloco `emissao`,
  # que lê a data local de ide/dhEmi. Antes elas comparavam só o percentual e,
  # a partir de 01/01/2027, avisariam toda nota correta. Nota sem dhEmi legível
  # não gera achado destas regras: melhor não avisar do que avisar pela lei do
  # ano errado.
  #
  # Continuam AVISO: a promoção a erro é decisão separada.
  #
  # O que estas regras NÃO cobrem, e por quê:
  # - combustíveis do regime específico (arts. 172–180): o art. 347 os exclui
  #   da CBS de transição; o art. 344, parágrafo único, III, NÃO os exclui do
  #   IBS de 2027–2028, só manda aplicar os 0,05% sobre o valor da operação.
  #   Como vão em gIBSCBSMono, fora dos caminhos daqui, estas regras não os
  #   conferem;
  # - CBS de 2027 em diante (art. 347): é a alíquota de referência menos 0,1
  #   p.p., e a referência depende de resolução do Senado ainda não publicada.
  #   Sem ela não há número para conferir, e a regra não existe.
  # - redução proporcional nos regimes de alíquota reduzida (art. 344): o
  #   leiaute leva a redução em gRed (pRedAliq/pAliqEfet) e o percentual nominal
  #   em pIBSUF/pIBSMun — leitura do leiaute, não confirmada em nota real; por
  #   isso também é aviso.
  #
  # Borda conhecida, registrada e sem mudança de código (é só aviso): o ano vem
  # do dhEmi como o emissor o escreveu, sem converter fuso. Emissor que escreva
  # em UTC perto da meia-noite cai no ano seguinte (2027-01-01T02:30:00+00:00 é
  # 31/12/2026 23:30 em Brasília). E a lei fala de fato gerador, não de emissão:
  # devolução ou complementar emitida em janeiro de 2027 sobre operação de 2026
  # pode receber aviso pela regra de 2027.

  - id: ibs-aliquota-uf-2026
    tipo: valor_numerico_em
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS/gIBSCBS/gIBSUF/pIBSUF
    valores: ["0.10"]
    emissao: {de: "2026-01-01", ate: "2026-12-31"}
    mensagem: Alíquota estadual de IBS diferente da prevista para 2026
    referencia: LC 214/2025, art. 343 · IBS 2026 = alíquota estadual de 0,1%
    vigencia:
      reavaliar_em: "2027-01-31"
      fonte: "LC 214/2025, art. 343"
      observacao: >
        O percentual tem fonte primária: o art. 343 cobra o IBS de 2026 pela
        alíquota estadual de 0,1%. Reavaliar ao fim do primeiro mês do período
        do art. 344 (01/01/2027): conferir contra notas reais que a troca de
        regra pela data de emissão não gera falso positivo na virada do ano, e
        se os arts. 343–344 foram alterados.
        Borda conhecida: o ano é o do dhEmi como escrito, sem converter fuso
        (dhEmi em UTC perto da meia-noite cai no ano seguinte), e a lei fala de
        fato gerador, não de emissão (devolução em jan/2027 de operação de 2026
        pode receber aviso). Ver o comentário acima das regras de alíquota.
    acao: >
      Para nota emitida em 2026, o IBS é cobrado pela alíquota estadual de 0,1%
      (pIBSUF = 0,10), conforme o art. 343 da LC 214/2025. Confira o percentual
      e a data de emissão da nota.

  - id: ibs-aliquota-uf-2027-2028
    tipo: valor_numerico_em
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS/gIBSCBS/gIBSUF/pIBSUF
    valores: ["0.05"]
    emissao: {de: "2027-01-01", ate: "2028-12-31"}
    mensagem: Alíquota estadual de IBS diferente da prevista para 2027–2028
    referencia: >-
      LC 214/2025, art. 344 · IBS 2027–2028 = 0,05% estadual + 0,05%
      municipal
    vigencia:
      reavaliar_em: "2027-01-31"
      fonte: "LC 214/2025, art. 344"
      observacao: >
        Percentual com fonte primária (art. 344). Reavaliar ao fim do primeiro
        mês de vigência: conferir contra notas reais de 2027, inclusive em
        regime de alíquota reduzida, que o percentual nominal vai em pIBSUF (a
        redução em gRed) — leitura do leiaute ainda não confirmada em nota real.
        Borda conhecida: o ano é o do dhEmi como escrito, sem converter fuso
        (dhEmi em UTC perto da meia-noite cai no ano seguinte), e a lei fala de
        fato gerador, não de emissão (devolução em jan/2027 de operação de 2026
        pode receber aviso). Ver o comentário acima das regras de alíquota.
    acao: >
      Para nota emitida em 2027 ou 2028, a alíquota estadual do IBS é 0,05%
      (pIBSUF = 0,05), conforme o art. 344 da LC 214/2025. Confira o
      percentual e a data de emissão da nota.

  - id: ibs-aliquota-mun-2027-2028
    tipo: valor_numerico_em
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS/gIBSCBS/gIBSMun/pIBSMun
    valores: ["0.05"]
    emissao: {de: "2027-01-01", ate: "2028-12-31"}
    mensagem: Alíquota municipal de IBS diferente da prevista para 2027–2028
    referencia: >-
