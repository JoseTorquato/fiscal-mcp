grupo: ibs-cbs
#
# Estado desta camada, em 25/08/2026.
#
# O leiaute de IBS/CBS está mapeado e é verificável — sai do XSD oficial e da
# tabela de CST/cClassTrib publicada pela SVRS. O que NÃO está confirmado em
# fonte primária são os códigos numéricos de rejeição, e essa distinção decide
# o que pode virar erro: nenhuma mensagem daqui cita número de rejeição antes
# de o número ter sido lido na nota técnica vigente.
#
# A NT 2025.002 v1.51, aprovada pelo Ato Técnico Conjunto RFB/CGIBS nº 1 de
# 31/07/2026, reclassificou a regra UB12-10 — a que exigiria o grupo IBSCBS —
# de data fixa para "implementação futura". Ou seja: a rejeição por ausência do
# grupo NÃO está ativa em produção para NF-e e NFC-e. Uma regra que acusasse
# erro aqui hoje acusaria errado.
#
# Isso é postergação técnica, não jurídica: a obrigação de destacar permanece, e
# o descumprimento afeta a dispensa de recolhimento do art. 348 da LC 214/2025.
# Em 2026 a nota corretamente preenchida É o mecanismo de dispensa.
#
# As 14 regras estruturais da Camada A entram nos blocos seguintes do ciclo.
# Ver docs/spec/05-camada-a-ibs-cbs.md.

regras:
  - id: ibs-cbs-grupo-totais-presente
    tipo: existe
    severidade: aviso
    campo: total/IBSCBSTot
    mensagem: Grupo de totais de IBS/CBS não encontrado
    referencia: >
      NT 2025.002 v1.51 · UB12-10 reclassificada como implementação futura
    vigencia:
      reavaliar_em: "2026-09-01"
      fonte: "Ato Técnico Conjunto RFB/CGIBS nº 1, de 31/07/2026"
      observacao: >
        Reavaliar quando entrarem as validações de 01/09/2026 (homologação) e
        05/10/2026 (produção).
    acao: >
      Inclua o grupo de totais de IBS/CBS na nota. A rejeição correspondente
      (regra UB12-10) foi postergada para implementação futura pela NT 2025.002
      v1.51, então a nota não é recusada por isso hoje — mas o destaque continua
      legalmente obrigatório e condiciona a dispensa de recolhimento do
      art. 348 da LC 214/2025.
