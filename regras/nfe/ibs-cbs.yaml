grupo: ibs-cbs
#
# Camada A do IBS/CBS — validação estrutural.
# Ver docs/spec/05-camada-a-ibs-cbs.md.
#
# O que separa esta camada da próxima: aqui tudo é verificável contra dado
# baixável e versionado (o XSD oficial e a tabela CST/cClassTrib da SVRS), então
# pode ser `erro`. Os CÓDIGOS numéricos de rejeição não foram confirmados em
# fonte primária, e por isso nenhuma mensagem daqui cita um. Descrever o
# problema sem o número é sempre permitido e quase sempre suficiente: quem lê é
# um agente que precisa saber o que fazer, não decorar o código do erro.
#
# Sobre a obrigatoriedade do grupo: a NT 2025.002 v1.51, aprovada pelo Ato
# Técnico Conjunto RFB/CGIBS nº 1 de 31/07/2026, reclassificou a regra UB12-10
# de data fixa para "implementação futura". A rejeição por ausência do grupo NÃO
# está ativa em produção para NF-e e NFC-e. É postergação técnica, não jurídica:
# a obrigação de destacar permanece e condiciona a dispensa de recolhimento do
# art. 348 da LC 214/2025.
#
# Duas regras nascem como aviso de propósito, e a razão está em cada uma.

regras:

  # ---- ausência do grupo: aviso, porque a rejeição está postergada ----------

  - id: ibs-grupo-ausente
    tipo: existe
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS
    mensagem: Grupo IBSCBS ausente no item
    referencia: >
      NT 2025.002 v1.51 · UB12-10 reclassificada como implementação futura
    vigencia:
      reavaliar_em: "2026-09-01"
      fonte: "Ato Técnico Conjunto RFB/CGIBS nº 1, de 31/07/2026"
      observacao: >
        Reavaliar quando entrarem as validações de 01/09/2026 (homologação) e
        05/10/2026 (produção).
    acao: >
      Inclua o grupo IBSCBS com CST e cClassTrib no item. A rejeição
      correspondente foi postergada para implementação futura pela NT 2025.002
      v1.51, então a nota não é recusada por isso hoje — mas o destaque continua
      legalmente obrigatório e condiciona a dispensa de recolhimento do art. 348
      da LC 214/2025.

  # ---- L-01 a L-04: CST e cClassTrib contra a tabela oficial ---------------

  - id: ibs-cst-existe
    tipo: em_tabela
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/CST
    tabela: cst-cclasstrib
    coluna: cst
    mensagem: CST de IBS/CBS não existe na tabela oficial
    referencia: Tabela de Classificação Tributária · Portal da Conformidade Fácil (SVRS)
    acao: >
      Use um dos 18 CST publicados. `fiscal-mcp tabelas` mostra qual versão da
      tabela está embarcada; a lista completa está em
      regras/tabelas/cst-cclasstrib.json.

  - id: ibs-cclasstrib-prefixo-cst
    tipo: prefixo_de
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/cClassTrib
    campo_referencia: imposto/IBSCBS/CST
    tamanho: 3
    mensagem: cClassTrib não corresponde ao CST do item
    referencia: cClassTrib tem 6 dígitos, e os 3 primeiros são o próprio CST
    acao: >
      Os três primeiros dígitos do cClassTrib são o CST do item. Este é o erro
      mais comum ao ligar o módulo de IBS/CBS num ERP: uma classificação
      genérica é aplicada a todos os itens e deixa de casar com o CST de cada um.

  - id: ibs-cclasstrib-existe
    tipo: em_tabela
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    mensagem: cClassTrib não existe na tabela oficial
    referencia: Tabela de Classificação Tributária · Portal da Conformidade Fácil (SVRS)
    acao: >
      Confira o código na tabela oficial. Códigos são publicados por ato do
      Comitê Gestor — código novo pode significar que a tabela embarcada está
      desatualizada; `fiscal-mcp tabelas` mostra a versão em uso.

  - id: ibs-cclasstrib-modelo
    tipo: em_tabela
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    filtro: modelo_do_documento
    mensagem: cClassTrib não é permitido neste modelo de documento
    referencia: Indicadores IndNfe e IndNfce da tabela oficial
    acao: >
      A tabela oficial diz, para cada cClassTrib, em quais documentos ele vale.
      Este código existe, mas não para o modelo desta nota — escolha a
      classificação equivalente prevista para o modelo.

  # ---- L-05: subgrupos exigidos pelos indicadores --------------------------
  #
  # A regra mais valiosa e a mais perigosa. Nasce como AVISO e só vira erro
  # depois de rodar contra pelo menos três XMLs reais distintos sem falso
  # positivo — a promoção fica registrada no CHANGELOG (spec 05 §6).
  #
  # O mapa cobre só os subgrupos cujo caminho é inequívoco. gRed e gDif ficaram
  # de fora de propósito: aparecem sob gIBSUF, gIBSMun E gCBS, e um caminho só
  # não os expressa. Entram quando a Camada XSD resolver a cardinalidade.

  - id: ibs-subgrupos-obrigatorios
    tipo: subgrupos_por_indicador
    escopo: item
    severidade: aviso
    campo_chave: imposto/IBSCBS/cClassTrib
    tabela: cst-cclasstrib
    coluna: cclasstrib
    mapa:
      IndMonofasica: imposto/IBSCBS/gIBSCBSMono
      IndTransferenciaCred: imposto/IBSCBS/gTransfCred
      IndAjusteCompet: imposto/IBSCBS/gAjusteCompet
      IndTribRegular: imposto/IBSCBS/gIBSCBS/gTribRegular
      IndPermiteCredPres: imposto/IBSCBS/gCredPresOper
      IndCredPresIbsZfm: imposto/IBSCBS/gCredPresIBSZFM
      IndEstornoCred: imposto/IBSCBS/gEstornoCred
    mensagem: Subgrupo de IBS/CBS incompatível com a classificação tributária
    referencia: Indicadores da tabela oficial, nos níveis CST e cClassTrib
    vigencia:
      reavaliar_em: "2026-11-01"
      fonte: "Tabela de Classificação Tributária (SVRS), publicação de 22/06/2026"
      observacao: >
        Entra como aviso. Promover a erro só depois de três XMLs reais distintos
        sem falso positivo, com a promoção registrada no CHANGELOG.
    acao: >
      A classificação tributária escolhida determina quais subgrupos o item
      precisa trazer e quais não admite. Confira o cClassTrib contra o
      preenchimento, ou corrija a classificação se o preenchimento é que está
      certo.

  # ---- L-06 a L-10: aritmética, exclusividade, presença condicional --------

  - id: ibs-vibs-soma-uf-mun
    tipo: soma_campos
    escopo: item
    severidade: erro
    campo_total: imposto/IBSCBS/gIBSCBS/vIBS
    campos:
      - imposto/IBSCBS/gIBSCBS/gIBSUF/vIBSUF
      - imposto/IBSCBS/gIBSCBS/gIBSMun/vIBSMun
    tolerancia: "0.01"
    mensagem: vIBS não é a soma das parcelas estadual e municipal
    referencia: Leiaute UB54a · vIBS = vIBSUF + vIBSMun
    acao: >
      O vIBS do item é a soma de vIBSUF e vIBSMun. Diferença de centavos costuma
      ser arredondamento aplicado no total em vez de item a item.

  - id: ibs-totais-conferem-ibs
    tipo: soma_itens
    severidade: erro
    campo_item: imposto/IBSCBS/gIBSCBS/vIBS
    campo_total: total/IBSCBSTot/gIBS/vIBS
    tolerancia: "0.01"
    mensagem: Total de IBS não bate com a soma dos itens
    referencia: Grupo W34 · IBSCBSTot
    acao: >
      Some o vIBS de cada item e compare com total/IBSCBSTot/gIBS/vIBS.

  - id: ibs-totais-conferem-cbs
    tipo: soma_itens
    severidade: erro
    campo_item: imposto/IBSCBS/gIBSCBS/gCBS/vCBS
    campo_total: total/IBSCBSTot/gCBS/vCBS
    tolerancia: "0.01"
    mensagem: Total de CBS não bate com a soma dos itens
    referencia: Grupo W34 · IBSCBSTot
    acao: >
      Some o vCBS de cada item e compare com total/IBSCBSTot/gCBS/vCBS.

  - id: ibs-grupo-exclusivo
    tipo: exclusivo
    escopo: item
    severidade: erro
    campos:
      - imposto/IBSCBS/gIBSCBS
      - imposto/IBSCBS/gIBSCBSMono
      - imposto/IBSCBS/gTransfCred
      - imposto/IBSCBS/gAjusteCompet
    mensagem: Mais de um regime de IBS/CBS no mesmo item
    referencia: Escolha UB14k · no máximo um dos ramos
    acao: >
      O item segue um regime só: tributação normal (gIBSCBS), monofasia
      (gIBSCBSMono), transferência de crédito (gTransfCred) ou ajuste de
      competência (gAjusteCompet). Remova os que não se aplicam.

  # Segundo choice do grupo, que a spec 05 §4 não documentava e o XSD mostra:
  # gCredPresOper e gCredPresIBSZFM são mutuamente exclusivos.
  - id: ibs-credito-presumido-exclusivo
    tipo: exclusivo
    escopo: item
    severidade: erro
    campos:
      - imposto/IBSCBS/gCredPresOper
      - imposto/IBSCBS/gCredPresIBSZFM
    mensagem: Dois regimes de crédito presumido no mesmo item
    referencia: Escolha entre gCredPresOper e gCredPresIBSZFM · XSD TTribNFe
    acao: >
      O item usa crédito presumido por operação (gCredPresOper) ou o da Zona
      Franca de Manaus (gCredPresIBSZFM), nunca os dois. Remova o que não se
      aplica.

  - id: ibs-cst-620-exige-mono
    tipo: condicional
    escopo: item
    severidade: erro
    quando_campo: imposto/IBSCBS/CST
    quando_valor: ["620"]
    campo: imposto/IBSCBS/gIBSCBSMono
    mensagem: CST de monofasia sem o grupo de monofasia
    referencia: CST 620 · IndMonofasica na tabela oficial
    acao: >
      O CST 620 identifica operação monofásica e exige o grupo gIBSCBSMono no
      item. Se a operação não é monofásica, o CST é que está errado.

  # Roda por item e olha para fora dele: `quando_campo` é relativo ao `det`,
  # `campo` começa com `/` e vale a partir da raiz. A versão anterior rodava no
  # documento e só enxergava o primeiro `det`, então nota em que apenas um item
  # do meio trazia o grupo passava batido.
  - id: ibs-totais-presentes
    tipo: condicional
    escopo: item
    severidade: erro
    quando_campo: imposto/IBSCBS/CST
    campo: /total/IBSCBSTot
    mensagem: Item com IBS/CBS e nota sem o grupo de totais
    referencia: Grupo W34 · IBSCBSTot
    acao: >
      Se algum item traz o grupo IBSCBS, a nota precisa trazer o grupo de totais
      IBSCBSTot com as bases e os valores consolidados.

  # ---- L-11 a L-14: formato, enums, alíquotas ------------------------------

  - id: ibs-competapur-formato
    tipo: formato
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/gAjusteCompet/competApur
    padrao: "\\d{4}-(0[1-9]|1[0-2])"
    mensagem: Competência de apuração fora do formato
    referencia: Grupo UB112 · competApur no formato AAAA-MM
    acao: "A competência vai como AAAA-MM, ex.: 2026-08."

  # A regra de escala decimal que a spec 05 §6 previa (L-12) foi RETIRADA por
  # dois motivos, e o segundo é o que decide:
  #
  #   1. é redundante — o XSD já valida a escala pelo tipo TDec1302RTC;
  #   2. estava ERRADA. O padrão do leiaute é `0|0\.[0-9]{2}|[1-9][0-9]{0,12}(\.[0-9]{2})?`,
  #      que aceita `0` sozinho. A regra escrita à mão exigia sempre duas casas e
  #      teria reprovado `<vIBS>0</vIBS>`, que é válido.
  #
  # É o caso exemplar de por que o XSD é a verdade executável: a regra de formato
  # escrita a partir da leitura do leiaute tinha um falso positivo latente.
  # Escala decimal agora é responsabilidade da camada de schema (extra [xsd]).

  - id: ibs-enum-credpres-zfm
    tipo: valor_em
    escopo: item
    severidade: erro
    campo: imposto/IBSCBS/gCredPresIBSZFM/tpCredPresIBSZFM
    valores: ["0", "1", "2", "3", "4"]
    mensagem: Tipo de crédito presumido da ZFM fora dos valores previstos
    referencia: Domínio de tpCredPresIBSZFM
    acao: Use um dos valores previstos no leiaute para o crédito presumido da ZFM.

  # A regra de tpALCZFMCBS que a spec 05 §6 previa foi RETIRADA: o elemento não
  # existe no XSD oficial embarcado, e o domínio {1,2} veio de extração de PDF,
  # sem confirmação em fonte primária. Regra sobre elemento inexistente é peso
  # morto, e domínio não confirmado é exatamente o que este projeto não publica.
  # Volta quando aparecer num pacote de schema, com o domínio lido do XSD.

  # As alíquotas de 2026 são de transição assistida: 0,1% de IBS e 0,9% de CBS,
  # sem recolhimento. Fica como AVISO porque uma fonte secundária afirma que a
  # parcela municipal é 0,00% com preenchimento obrigatório, com os 0,1% inteiros
  # na parcela estadual — não confirmado em fonte oficial. Enquanto a dúvida
  # existir, a regra não pode reprovar.
  - id: ibs-aliquota-uf-2026
    tipo: valor_numerico_em
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS/gIBSCBS/gIBSUF/pIBSUF
    valores: ["0.10"]
    mensagem: Alíquota estadual de IBS diferente da alíquota-teste de 2026
    referencia: Transição assistida de 2026 · IBS 0,1%
    vigencia:
      reavaliar_em: "2026-10-05"
      fonte: "NT 2025.002-RTC · alíquotas de transição"
      observacao: >
        Repartição entre parcela estadual e municipal não confirmada em fonte
        oficial. Reavaliar junto com as validações de produção de 05/10/2026.
    acao: >
      Em 2026 a alíquota de IBS é 0,1% em regime de transição assistida, sem
      recolhimento. Confira o percentual com a legislação vigente antes de
      alterar — este achado é aviso justamente porque a repartição entre estado
      e município não está confirmada em fonte oficial.

  - id: ibs-aliquota-cbs-2026
    tipo: valor_numerico_em
    escopo: item
    severidade: aviso
    campo: imposto/IBSCBS/gIBSCBS/gCBS/pCBS
    valores: ["0.90"]
    mensagem: Alíquota de CBS diferente da alíquota-teste de 2026
    referencia: Transição assistida de 2026 · CBS 0,9%
    vigencia:
      reavaliar_em: "2026-10-05"
      fonte: "NT 2025.002-RTC · alíquotas de transição"
    acao: >
      Em 2026 a alíquota de CBS é 0,9% em regime de transição assistida, sem
      recolhimento.
