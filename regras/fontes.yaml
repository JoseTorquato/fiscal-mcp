# Fontes oficiais monitoradas, e o que já se sabe delas.
#
# Mesma tese do resto de `regras/`: isto é **dado versionado**, não código. Cada
# documento listado aqui é um documento que alguém já viu. O que aparecer na
# fonte e não estiver nesta lista é, por definição, novidade — e novidade fiscal
# rende uma issue para um humano ler.
#
# O monitor não interpreta nada do que encontra. Ele não abre o PDF, não deriva
# regra e não sugere código: durante a pesquisa da spec 05, uma extração
# automatizada de nota técnica produziu códigos de rejeição inexistentes. Nota
# técnica se lê com olho humano. Ver docs/spec/05-camada-a-ibs-cbs.md §3.
#
# Nada aqui é consultado em tempo de validação, e nada disto roda em CI de
# push/PR — pelo mesmo motivo que a tabela oficial vive versionada:
# indisponibilidade de site de terceiro não pode quebrar o build de ninguém.
#
#     python scripts/monitor_fontes.py            # o que mudou desde a última conferida
#     python scripts/monitor_fontes.py --semear   # depois de ler, registra o que está no ar
#
versao: 1

fontes:

  # Tabela de Classificação Tributária: o dado que sustenta as regras de IBS/CBS
  # da Camada A. Já vive versionada em regras/tabelas/, com sha256 declarado na
  # procedência — então aqui o monitor faz duas perguntas: o arquivo versionado
  # continua sendo o que a procedência declara, e a fonte continua publicando o
  # mesmo conteúdo. As duas respostas negativas exigem gente.
  - id: tabela-classificacao-tributaria
    nome: Tabela de Classificação Tributária (CST × cClassTrib) — SVRS
    tipo: tabela
    url: https://dfe-portal.svrs.rs.gov.br/CFF/ClassificacaoTributaria
    arquivo: regras/tabelas/cst-cclasstrib.json
    procedencia: regras/tabelas/PROCEDENCIA.md

  # Notas técnicas da NF-e: a fonte que anuncia mudança de leiaute e de regra de
  # validação, com semanas a meses de antecedência (docs/spec/04-manutencao.md).
  # A identidade de um documento é o título como o portal o publica — ele já
  # carrega número, versão e data ("Nota Técnica 2025.002 v.1.51 - Publicada em
  # 04/08/2026"). Versão nova é título novo, e é assim que ela é detectada.
  - id: notas-tecnicas-nfe
    nome: Notas Técnicas do Portal da NF-e
    tipo: lista_de_documentos
    url: https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=04BIflQt1aY=
