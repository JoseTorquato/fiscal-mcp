# Pacotes de schema da NF-e (PL) que o fiscal-mcp sabe reconhecer.
#
# `leiaute_validado_contra` diz contra qual pacote a nota foi validada. A versão
# anterior tirava esse nome do texto do `leiauteNFe_v4.00.xsd`, que lista PLs
# antigos em comentário e não diz qual é o vigente: com a nfelib 3.3.0 o laudo
# dizia `PL_005d`, quando o conteúdo é o PL 010f v1.04.
#
# Agora o pacote é identificado pelo CONTEÚDO: o sha256 de cada XSD instalado é
# comparado com o do ZIP oficial do Portal da NF-e. Nada aqui é escrito à mão a
# partir de leitura: os sha256 saem dos arquivos do ZIP baixado, e o ZIP tem o
# próprio sha256 registrado. Pacote cujo conteúdo não bate com nenhum destes sai
# como "não identificado", nunca com um nome adivinhado.
#
# Para registrar um pacote novo: baixar o ZIP do Portal, calcular o sha256 do
# ZIP e de cada arquivo listado em `arquivos`, e acrescentar a entrada com
# origem e data. Lista: https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=BMPFMBoln3w=

versao: 1

# Qual nfelib embarca qual pacote (wheels do PyPI lidos em 24/11/2026, só os
# arquivos, sem instalar). É a evidência da proposta de mínimo `nfelib>=2.6.0`
# no extra [xsd] — o pyproject ainda diz `>=2.5`:
#
#   2.5.3  25/09/2026  sem SCHEMA_PACKAGE; XSD fora deste registro; sem
#                      gIBSMonoAdRem (não tem a monofasia da NT 2025.002 v1.50)
#   2.6.0  26/09/2026  declara PL_010f_v1.04; XSD = PL 010f v1.04 deste registro
#   3.0.0 a 3.3.0      idem (3.3.0 de 05/11/2026); nenhuma traz o PL 010h
#
# A 2.5.3 é a versão imediatamente anterior à 2.6.0 no PyPI.

# Os arquivos que identificam o pacote. São os do leiaute da NF-e que a
# validação usa (nfe_v4.00.xsd e o que ele importa).
arquivos:
  - DFeTiposBasicos_v1.00.xsd
  - leiauteNFe_v4.00.xsd
  - nfe_v4.00.xsd
  - tiposBasico_v4.00.xsd
  - xmldsig-core-schema_v1.01.xsd

