[project]
name = "fiscal-mcp"
version = "0.3.0"
description = "Validador de NF-e, NFC-e e NFS-e offline: schema XSD oficial, IBS/CBS e chave de acesso, sem certificado"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "José Torquato", email = "jltorquato12@gmail.com" }]
keywords = ["mcp", "nfe", "nota-fiscal", "sefaz", "fiscal", "brasil", "ibs", "cbs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["lxml>=5.0", "pyyaml>=6.0"]

[project.optional-dependencies]
# O núcleo (validação, chave, rejeições) funciona sem o SDK. Só o servidor precisa.
servidor = ["mcp>=2.0"]
# Validação por schema XSD. A nfelib (MIT) entra só pelos arquivos .xsd oficiais
# que ela empacota — a validação em si é do lxml, que já é dependência do núcleo.
# >=2.6.0: primeira versão que embarca o PL 010f v1.04 (monofasia da NT 2025.002
# v1.50). A evidência está no cabeçalho de regras/schema/pacotes.yaml.
xsd = ["nfelib>=2.6.0"]

[project.urls]
Homepage = "https://josetorquato.dev/fiscal-mcp/"
Source = "https://github.com/JoseTorquato/fiscal-mcp"

[project.scripts]
fiscal-mcp = "fiscal_mcp.cli:main"
fiscal-mcp-servidor = "fiscal_mcp.servidor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiscal_mcp"]

# As regras e as tabelas oficiais vivem fora do pacote no repositório, mas
# precisam viajar dentro dele quando instalado — senão `pip install` entrega um
# validador sem nenhuma regra, ou pior: com regra e sem a tabela que ela consulta.
# `regras/tabelas/` vai junto por estar dentro de `regras/`.
[tool.hatch.build.targets.wheel.force-include]
"regras" = "fiscal_mcp/regras"

# Changelog por fragmentos: cada PR deixa um arquivo em changelog.d/, e o PR de
# release junta tudo com `scriv collect`. Ver CONTRIBUTING.md, "Changelog".
# As categorias são as que o CHANGELOG.md já usa; "Absorvido da legislação" é a
# única fiscal, e tests/test_changelog_d.py cobra os quatro campos com mais rigor
# nela.
[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
changelog = "CHANGELOG.md"
version = "literal: fiscal_mcp/__init__.py: __version__"
md_header_level = "2"
md_html_anchors = false
entry_title_template = "{{ version }} — {{ date.strftime('%Y-%m-%d') }}"
fragment_name_fields = ["created", "branch"]
new_fragment_template = "file: changelog.d/_modelo.md.j2"
categories = [
  "Absorvido da legislação",
  "Adicionado",
  "Alterado",
  "Corrigido",
  "Removido",
  "Fontes monitoradas",
]
