[project]
name = "fiscal-mcp"
version = "0.2.1"
description = "Validador de NF-e, NFC-e e NFS-e offline: schema XSD oficial, IBS/CBS e chave de acesso, sem certificado"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "José Torquato", email = "jltorquato12@gmail.com" }]
keywords = ["mcp", "nfe", "nota-fiscal", "sefaz", "fiscal", "brasil", "ibs", "cbs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["lxml>=5.0", "pyyaml>=6.0"]

[project.optional-dependencies]
# O núcleo (validação, chave, rejeições) funciona sem o SDK. Só o servidor precisa.
servidor = ["mcp>=2.0"]
# Validação por schema XSD. A nfelib (MIT) entra só pelos arquivos .xsd oficiais
# que ela empacota — a validação em si é do lxml, que já é dependência do núcleo.
xsd = ["nfelib>=2.5"]

[project.urls]
Homepage = "https://josetorquato.dev/fiscal-mcp/"
Source = "https://github.com/JoseTorquato/fiscal-mcp"

[project.scripts]
fiscal-mcp = "fiscal_mcp.cli:main"
fiscal-mcp-servidor = "fiscal_mcp.servidor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiscal_mcp"]

# As regras e as tabelas oficiais vivem fora do pacote no repositório, mas
# precisam viajar dentro dele quando instalado — senão `pip install` entrega um
# validador sem nenhuma regra, ou pior: com regra e sem a tabela que ela consulta.
# `regras/tabelas/` vai junto por estar dentro de `regras/`.
[tool.hatch.build.targets.wheel.force-include]
"regras" = "fiscal_mcp/regras"
